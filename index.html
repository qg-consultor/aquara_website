<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquara - Purificación de Agua Inteligente y Bienestar Premium</title>
    <meta name="description" content="Experimenta el agua en su forma más pura con Aquara. Sistemas inteligentes de optimización mineral y purificación de agua premium para tu hogar.">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- ENTER EXPERIENCE OVERLAY -->
    <div id="enter-overlay" class="enter-overlay">
        <div class="enter-content">
            <h2 class="enter-title">BIENVENIDOS A AQUARA</h2>
            <div id="enter-loader" class="enter-loader"></div>
            <button id="enter-btn" class="enter-btn">ENTRAR</button>
        </div>
    </div>

    <!-- FLOATING NAVBAR -->
    <nav class="navbar">
        <a href="#" class="logo" id="nav-logo">
            <img src="./LOGOS/aquaraws_logotipo-transp_400x150.png" alt="Aquara Logo" style="height: 40px; width: auto;" />
        </a>
        
        <nav class="navMenu">
            <a href="#">SOMOS</a>
            <a href="#">SOLUCIONES</a>
            <a href="#">INNOVACIÓN</a>
            <a href="#">KURITA AMÉRICA</a>
            <div class="dot"></div>
        </nav>

        <a href="mailto:info@aquara.com" class="nav-btn" id="nav-cta-btn">CONTACTAR</a>
    </nav>

    <!-- INMERSIVE HERO SECTION -->
    <header class="hero" id="inicio">
        <!-- Interactive 3D WebGL Canvas Layer -->
        <div id="hero-canvas" class="hero-canvas-container"></div>
        <div class="hero-overlay"></div>
        
        <div class="hero-container container">
            <div class="hero-text-side">

                <h1>Soluciones avanzadas en<br><span class="gradient-text">tratamiento de agua</span></h1>

                <p class="hero-description">Somos líderes en acondicionamiento de agua para el sector industrial</p>
                <div class="cta-group">
                    <a href="mailto:info@aquara.com" class="btn-primary" id="hero-primary-btn">Explorar Aquara Home</a>
                </div>
            </div>
            <div class="hero-interactive-zone"></div>
        </div>

        <!-- TRUST BAR — Full-width authority strip at hero bottom -->
        <div class="trust-bar">
            <div class="trust-bar-label">
                <span class="trust-bar-line"></span>
                <span class="trust-bar-text">Certificaciones &amp; Alianzas</span>
                <span class="trust-bar-line"></span>
            </div>
            <div class="marquee-wrapper">
                <div class="marquee-track">
                    <!-- Set 1 -->
                    <div class="marquee-item"><img src="/logos/FMEAE_Logo.png" alt="FMEAE — Federal Ministry for Economic Affairs and Energy" /></div>
                    <span class="marquee-sep">✦</span>
                    <div class="marquee-item"><img src="/logos/Kurita_Cer.png" alt="Kurita Certified Partner" /></div>
                    <span class="marquee-sep">✦</span>
                    <div class="marquee-item"><img src="/logos/kurita_logo.png" alt="Kurita Water Industries" /></div>
                    <span class="marquee-sep">✦</span>
                    <div class="marquee-item"><img src="/logos/ca_logo.png" alt="ConnectAmericas" /></div>
                    <span class="marquee-sep">✦</span>
                    <!-- Set 2 (duplicate for seamless loop) -->
                    <div class="marquee-item"><img src="/logos/FMEAE_Logo.png" alt="FMEAE" /></div>
                    <span class="marquee-sep">✦</span>
                    <div class="marquee-item"><img src="/logos/Kurita_Cer.png" alt="Kurita Certified Partner" /></div>
                    <span class="marquee-sep">✦</span>
                    <div class="marquee-item"><img src="/logos/kurita_logo.png" alt="Kurita Water Industries" /></div>
                    <span class="marquee-sep">✦</span>
                    <div class="marquee-item"><img src="/logos/ca_logo.png" alt="ConnectAmericas" /></div>
                    <span class="marquee-sep">✦</span>
                </div>
            </div>
        </div>
        </div>
    </header>

    <script type="module" src="index.js"></script>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
